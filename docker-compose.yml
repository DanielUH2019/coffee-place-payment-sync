# One-command stack for the Coffee Place payment-sync project.
#
#   external-app  the StarHarbour Payments Service (Central System), built from the
#                 ./external submodule. Listens on 8080.
#   toxiproxy     sits IN FRONT of external-app. Callers hit 9091 to route through the
#                 proxy and experience injected network faults; 8474 is its admin API.
#   client        our Python CSV → API sync tool. Routes through Toxiproxy by default.
#
# Usage:
#   docker compose up --build -d external-app toxiproxy   # start the Central System
#   docker compose run --rm client examples/payments.csv  # sync a notebook CSV
#
# The `client` service is in the `tools` profile so it does not start with the stack;
# run it on demand with `docker compose run`.

services:
  external-app:
    build:
      context: .
      dockerfile: docker/external.Dockerfile
    container_name: coffee-external-app
    ports:
      - "8080:8080" # direct access to the app (bypasses Toxiproxy)
    healthcheck:
      # The list endpoint requires a Store-Id header; any 2xx means the app is up.
      test: ["CMD", "curl", "-fsS", "-H", "Store-Id: healthcheck", "http://localhost:8080/api/v1/payments?storeId=healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    container_name: coffee-toxiproxy
    depends_on:
      external-app:
        condition: service_healthy
    ports:
      - "8474:8474" # Toxiproxy REST API — add/remove toxics here
      - "9091:9091" # Proxy port — callers hit this instead of the app directly
    volumes:
      - ./docker/toxiproxy.json:/toxiproxy.json:ro
    command: ["-config", "/toxiproxy.json", "-host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 1s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: coffee-place-payment-sync-client
    profiles: ["tools"]
    depends_on:
      toxiproxy:
        condition: service_healthy
    environment:
      # By default route through Toxiproxy so the client genuinely feels injected faults.
      COFFEE_SYNC_BASE_URL: "http://toxiproxy:9091"
      COFFEE_SYNC_STORE_ID: "coffee-place-001"
    volumes:
      # Mount the repo so example CSVs and the dead-letter output are reachable from the host.
      - ./examples:/work/examples:ro
      - ./out:/work/out
    working_dir: /work

  temporal:
    # Single-container Temporal dev server (in-memory) for the HW4 Order-Ahead workflow.
    # In-memory state survives *worker* restarts (what F6 needs) as long as this container
    # stays up; it is not meant to survive a restart of the Temporal container itself.
    image: temporalio/temporal:latest
    container_name: coffee-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--log-level", "warn"]
    ports:
      - "7233:7233" # gRPC frontend — workers/clients connect here
      - "8233:8233" # Web UI — http://localhost:8233
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres-shard-0:
    image: postgres:16-alpine
    container_name: coffee-postgres-shard-0
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
    ports:
      - "5433:5432"
    volumes:
      - postgres-shard-0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-shard-1:
    image: postgres:16-alpine
    container_name: coffee-postgres-shard-1
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
    ports:
      - "5434:5432"
    volumes:
      - postgres-shard-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee"]
      interval: 2s
      timeout: 5s
      retries: 15

  async-api:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: coffee-place-payment-sync-client
    container_name: coffee-async-api
    entrypoint: ["coffee-sync-api"]
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
    environment:
      COFFEE_SYNC_DB_SHARDS: "postgresql://coffee:coffee@postgres-shard-0:5432/coffee,postgresql://coffee:coffee@postgres-shard-1:5432/coffee"
    ports:
      - "8000:8000"

  async-worker:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: coffee-place-payment-sync-client
    container_name: coffee-async-worker
    entrypoint: ["coffee-sync-worker"]
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy
    environment:
      COFFEE_SYNC_DB_SHARDS: "postgresql://coffee:coffee@postgres-shard-0:5432/coffee,postgresql://coffee:coffee@postgres-shard-1:5432/coffee"
      COFFEE_SYNC_BASE_URL: "http://toxiproxy:9091"
      COFFEE_SYNC_WORKER_POLL_SECONDS: "1.0"

volumes:
  postgres-shard-0-data:
  postgres-shard-1-data:
